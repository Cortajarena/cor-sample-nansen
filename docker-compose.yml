# ===========================================================================
# Nansen sample - address-label pipeline
#
# Everything runs in Docker. No host Node/Python required.
#
#   Presentation deck (docs/slides.md):
#     docker compose --profile slides up slides              # :3030
#     docker compose --profile slides run --rm slides-export # -> docs/dist/slides.pdf
#     docker compose --profile slides run --rm slides-build  # -> docs/dist/site/
#
#   Pipeline services live in src/compose.yml (included below):
#     docker compose --profile prefect up server init worker # API + UI on :4200
#     docker compose --profile dbt run --rm dbt --help
# ===========================================================================
name: nansen-sample

# Pipeline services (prefect + dbt), defined next to their sources
include:
  - src/compose.yml

x-slidev: &slidev
  build:
    context: docker/slidev
  # one shared image for all deck services (avoid per-service rebuilds)
  image: nansen-slidev
  working_dir: /slides
  volumes:
    - ./docs:/slides

services:
  # -------------------------------------------------------- Presentation
  # Live deck at http://localhost:3030
  slides:
    <<: *slidev
    profiles: ["slides"]
    ports:
      - "3030:3030"
    command: ["slidev", "dev", "/slides/slides.md", "--open=false", "--remote"]

  # One-shot export of the deck to PDF (docs/dist/slides.pdf)
  slides-export:
    <<: *slidev
    profiles: ["slides"]
    command:
      - slidev
      - export
      - /slides/slides.md
      - --format=pdf
      - --output=/slides/dist/slides.pdf
      - --timeout=60000

  # One-shot SPA build for GitHub Pages (docs/dist/site/)
  # --base must match the Pages sub-path (<user>.github.io/<repo>)
  slides-build:
    <<: *slidev
    profiles: ["slides"]
    command:
      - slidev
      - build
      - /slides/slides.md
      - --base=/cor-sample-nansen/
      - --download
      - --router-mode=hash
      - --out=/slides/dist/site

  # --------------------------------------------------- Draft (design doc)
  # docs/draft.md is a plain-markdown DOCUMENT - rendered with pandoc, not
  # Slidev (which would make it one giant slide). Build -> site/draft/
  draft-build:
    image: nansen-pandoc
    build:
      context: docker/pandoc
    profiles: ["slides"]
    volumes:
      - ./docs:/docs
    # CMD from the Dockerfile renders HTML (see docker/pandoc/render-draft.sh)

  # Draft -> self-contained HTML, mermaid bundle inlined (pandoc cannot
  # rasterize diagrams; the browser does). Input for draft-pdf below.
  #   docker compose --profile slides run --rm draft-pdf-html
  #   docker compose --profile slides run --rm draft-pdf-html /repo/draft-preview.html
  draft-pdf-html:
    image: nansen-pandoc
    build:
      context: docker/pandoc
    profiles: ["slides"]
    volumes:
      - ./docs:/docs
      - .:/repo
    entrypoint: ["render-draft-print"]
    command: ["/docs/dist/draft-print/index.html"]

  # Draft -> PDF: print the HTML above with the Chromium already in the
  # Slidev image (no second browser toolchain). Depends on draft-pdf-html.
  #   docker compose --profile slides run --rm draft-pdf
  draft-pdf:
    image: nansen-slidev
    build:
      context: docker/slidev
    profiles: ["slides"]
    environment:
      NODE_PATH: /usr/local/lib/node_modules
    volumes:
      - ./docs:/docs
      - ./docker/slidev/print-pdf.cjs:/opt/print/print-pdf.cjs:ro
    entrypoint: ["node", "/opt/print/print-pdf.cjs"]
    command:
      - /docs/dist/draft-print/index.html
      - /docs/dist/draft.pdf
    depends_on:
      draft-pdf-html:
        condition: service_completed_successfully

  # Fallback: draft -> PDF straight through pandoc + xelatex (TeX Live ships
  # in pandoc/extra). No browser involved and better pagination/footnotes,
  # but mermaid fences stay literal - pandoc cannot rasterize them.
  #   docker compose --profile slides run --rm draft-pdf-tex
  draft-pdf-tex:
    image: nansen-pandoc
    build:
      context: docker/pandoc
    profiles: ["slides"]
    volumes:
      - ./docs:/docs
    entrypoint: ["pandoc"]
    command:
      - /docs/draft.md
      - --pdf-engine=xelatex
      - --toc
      - "--metadata=title:Nansen: on-chain pipeline design (draft)"
      - --output=/docs/dist/draft-tex.pdf