# ===========================================================================
# Nansen sample - pipeline services (imported by the root compose file)
#
#   docker compose --profile prefect up server init worker
#   docker compose --profile dbt run --rm dbt --help
#
# Included from the root docker-compose.yml via the `include` directive.
# ===========================================================================

# host ADC credentials -> container (read-only), shared by GCP services
x-gcloud-creds: &gcloud-creds
  ${HOME}/.config/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro

x-gcloud-env: &gcloud-env
  GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json

x-prefect: &prefect
  image: nansen-prefect
  build:
    context: ./prefect
  profiles: ["prefect"]
  environment:
    PREFECT_API_URL: http://server:4200/api

services:
  # -------------------------------------------------------- Orchestration
  # Local Prefect server: REST API + UI at http://localhost:4200
  server:
    <<: *prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://server:4200/api
      PREFECT_UI_URL: http://localhost:4200
    volumes:
      - prefect-data:/root/.prefect
    command: ["server", "start", "--host=0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "/opt/prefect/healthcheck.py"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # One-shot: ensure the local work pool exists (idempotent, see bootstrap.py)
  init:
    <<: *prefect
    depends_on:
      server: {condition: service_healthy}
    entrypoint: ["python", "bootstrap.py"]

  # Worker: polls the work pool and executes flow runs
  worker:
    <<: *prefect
    volumes:
      - prefect-data:/root/.prefect
    depends_on:
      server: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    command: ["worker", "start", "--pool", "labels-local"]

  # -------------------------------------------------------- dbt (BigQuery)
  # One-shot: create the BigQuery dataset if missing. gcloud CLI for the
  # sample; real life = Terraform (IaC) via CI/CD (dataset resource, project
  # factory, least-privilege SAs, remote state). Discussion: docs/draft.md.
  bigquery-init:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    profiles: ["dbt"]
    volumes:
      - *gcloud-creds
    environment:
      DBT_PROJECT: ${DBT_PROJECT:?set DBT_PROJECT in .env - GCP project for the dataset}
      DBT_DATASET: ${DBT_DATASET:-nansen_labels_dev}
      <<: *gcloud-env
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - >-
        bq --location=US mk --dataset "$DBT_PROJECT:$DBT_DATASET"
        || echo "dataset $DBT_DATASET already exists (or auth failed) - skipping"

  # dbt CLI on the public Ethereum dataset (ENTRYPOINT is `dbt`).
  # Auth: mount gcloud creds read-only, or use a keyfile via env.
  dbt:
    image: nansen-dbt
    build:
      context: ./dbt
    profiles: ["dbt"]
    volumes:
      - *gcloud-creds
    environment:
      DBT_PROJECT: ${DBT_PROJECT:-your-gcp-project-id}
      DBT_DATASET: ${DBT_DATASET:-nansen_labels_dev}
      <<: *gcloud-env
    depends_on:
      bigquery-init: {condition: service_completed_successfully}
    # examples: run --rm dbt parse | compile | run | test
    command: ["--help"]

volumes:
  prefect-data: