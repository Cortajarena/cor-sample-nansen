# Sources: Google's Ethereum mainnet public dataset.
#
# bigquery-public-data.goog_blockchain_ethereum_mainnet_us is the successor to
# the (deprecated) crypto_ethereum dataset - it also ships traces and
# pre-decoded events, which matter for flow classification (initiator
# detection) and price extraction (DEX swaps).
#
# Same engine as our target warehouse: query directly, materialize what we
# use into our own dataset incrementally.

version: 2

sources:
  - name: ethereum_mainnet
    description: >
      Google-managed Ethereum mainnet dataset (8 core tables, from raw
      blocks down to pre-decoded contract events and historical account
      state).
    database: bigquery-public-data
    schema: goog_blockchain_ethereum_mainnet_us
    tables:
      - name: blocks
        description: >
          Base block data: hashes, numbers, timestamps, difficulty, gas
          limits, and natively nested arrays like withdrawals.
        config:
          loaded_at_field: block_timestamp
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: transactions
        description: >
          All transactions initiated by EOAs: gas pricing, value, payload
          data, and target addresses. The initiator (signer) for flow
          classification comes from here.

      - name: receipts
        description: >
          Transaction outcomes: actual status (success/failure), cumulative
          gas used, and effective gas price. Filter on status - failed txs
          move nothing.

      - name: logs
        description: >
          Raw event logs emitted by smart contracts during execution. Raw
          material for DEX swap extraction (implied prices).

      - name: traces
        description: >
          Parity-style internal traces: deep EVM execution, internal
          contract-to-contract value calls, block rewards. Catches
          transfers the transactions table cannot see.

      - name: token_transfers
        description: >
          Pre-parsed standard token activity across the network: ERC-20,
          ERC-721 (NFTs), and ERC-1155 transfers.

      - name: decoded_events
        description: >
          Google-managed table with pre-parsed, human-readable event
          parameters for popular smart contract interactions.

      - name: accounts_state
        description: >
          Historical account states recorded at explicit block heights
          whenever a wallet or contract transacted on-chain. Useful to
          validate balance reconstruction.