# ===========================================================================
# Build & deploy the Slidev deck to GitHub Pages
#
#   https://<user>.github.io/cor-sample-nansen
#
# The deck is built inside our own Docker image (docker/slidev.Dockerfile)
# via the same compose service used locally - no Node/npm on the runner host.
#
# One-time setup (repo Settings -> Pages): Source = "GitHub Actions"
# ===========================================================================
name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/slides.md
      - docs/draft.md
      - docker/**
      - docker-compose.yml
      - .github/workflows/slides-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a new push cancels the previous deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build deck (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same command as local: builds the slidev image, then the SPA.
      # --download also produces slides.pdf inside the site, served with
      # a "Download PDF" button in the deployed deck.
      - name: Build deck SPA
        run: docker compose --profile slides run --rm slides-build

      # Design doc (docs/draft.md): a DOCUMENT, not slides - rendered with
      # pandoc into site/draft/ (HTML with TOC) + a PDF next to it.
      - name: Build draft HTML
        run: docker compose --profile slides run --rm draft-build

      - name: Build draft PDF
        run: docker compose --profile slides run --rm draft-pdf

      - name: Move draft PDF into the site
        run: >
          docker compose --profile slides run --rm draft-build
          sh -c "mv /docs/dist/draft.pdf /docs/dist/site/draft/draft.pdf"

      # dbt docs (lineage graph, model + column docs) published alongside the
      # deck at <pages>/dbt-docs/.
      #
      # `dbt docs generate` introspects the warehouse, so it needs real
      # credentials: set GCP_SA_KEY (a service-account JSON key) and
      # DBT_PROJECT in repo secrets/variables. Without them we skip instead
      # of failing the deploy - the deck and the draft are the deliverable,
      # the docs are a bonus.
      - name: Build dbt docs
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DBT_PROJECT: ${{ vars.DBT_PROJECT || 'cor-sample-nansen' }}
        run: |
          set -eu
          mkdir -p "$HOME/.config/gcloud" docs/dist/site/dbt-docs
          printf '%s' "$GCP_SA_KEY" \
            > "$HOME/.config/gcloud/application_default_credentials.json"
          docker compose --profile dbt run --rm \
            -v "$PWD/docs/dist/site/dbt-docs:/out" \
            -e DBT_PROJECT="$DBT_PROJECT" \
            --entrypoint sh dbt -c "dbt docs generate && cp -r target/. /out/"

      # Fallback: docs/dbt-docs/ holds a snapshot generated locally (with
      # credentials) so the published path works even without the secret.
      # Without any index.html, GitHub Pages serves the deck's 404.html and
      # /dbt-docs/ silently boots the presentation instead.
      - name: Use committed dbt docs snapshot (no credentials)
        if: env.GCP_SA_KEY == ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          docker compose --profile slides run --rm slides-build sh -c 'mkdir -p /slides/dist/site/dbt-docs; cp -r /slides/dbt-docs/. /slides/dist/site/dbt-docs/'

      # Diagrams: docs/diagrams/*.mmd is the single source of truth; the SVGs
      # are rendered from it and referenced by BOTH the deck and the draft, so
      # they are copied into the site root once. Done inside the container
      # because dist/ is root-owned and a host-side cp gets "permission denied".

      - name: Copy diagrams into the site
        run: |
          docker compose --profile slides run --rm slides-build sh -c 'mkdir -p /slides/dist/site; cp -r /slides/diagrams /slides/dist/site/diagrams'

      # GitHub Pages must not process the output with Jekyll.
      # NB: dist/ is created root-owned by the container, so the touch has to
      # happen inside the container as well - a host-side touch gets
      # "permission denied" on the CI runner.
      # NB: keep the shell command on ONE line. In a YAML folded scalar (>)
      # more-indented lines keep their newlines, which turns a multi-line
      # `sh -c "..."` into several commands and fails with exit 127.
      - name: Add .nojekyll
        run: |
          docker compose --profile slides run --rm slides-build sh -c 'mkdir -p /slides/dist/site/draft /slides/dist/site/dbt-docs; for d in "" draft dbt-docs; do touch "/slides/dist/site/$d/.nojekyll"; done'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist/site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
